et-bottom));max-height:92vh;overflow:auto}.headrow{display:flex;justify-content:space-between;gap:10px}.sheet h3{font-size:22px;margin:0}.bigcap{font-size:38px;font-weight:900}.signal{display:inline-block;margin-top:7px;border-radius:99px;padding:6px 9px;font-size:12px;font-weight:850}.sg{background:#123825;color:#69ed9d}.sy{background:#473913;color:#ffda61}.sr{background:#4b1c21;color:#ff8187}.why{background:#16233d;border:1px solid #29406b;border-radius:13px;padding:10px;margin-top:10px;font-size:12px;line-height:1.4}.buy{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.buy input{width:100%;border:0;border-radius:11px;padding:11px;font-size:20px}.mine{background:var(--green);color:#07150c;border:0}.other{width:100%;margin-top:7px}.alts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.alt{background:#18233a;border:1px solid #2a3958;border-radius:10px;padding:7px;font-size:10px}.alt b{display:block;font-size:11px}.close{width:100%;margin-top:9px}.manual{display:none;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px;margin-top:9px}.manual.show{display:block}.manual input,.manual select{width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);background:#0c1322;color:white;margin-top:6px}.mgrid{display:grid;grid-template-columns:1fr 80px;gap:6px}@media(min-width:700px){.roster{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="top"><div class="title"><h1>⚽ Fanta Asta Live</h1><span class="ver">WEB • 8 squadre / 500</span></div><div class="balance"><div class="card"><div class="lab">Crediti rimasti</div><div class="credits" id="credits">500</div><div class="delta" id="delta">Strategia in equilibrio</div></div><div class="card"><div class="lab">Posti liberi</div><div class="slots" id="slots">25</div><div class="muted">riserva minima: <b id="reserve">25</b></div></div></div><div class="roles" id="roles"></div><div class="search"><input id="search" autocomplete="off" placeholder="Cerca giocatore…" disabled><button class="clear" id="clear">×</button></div><div class="chips"><button class="chip active" data-f="ALL">Tutti</button><button class="chip" data-f="P">P</button><button class="chip" data-f="D">D</button><button class="chip" data-f="C">C</button><button class="chip" data-f="A">A</button><button class="chip" data-f="AVAILABLE">Disponibili</button><button class="chip" data-f="OWNED">Miei</button></div></div><div class="status" id="loadStatus"><b class="yellow">Carico il listone aggiornato…</b><br>La prima apertura può richiedere qualche secondo.</div><div class="status" id="strategy"></div><div class="section"><h2>Giocatori</h2><span class="muted" id="count"></span></div><div class="results" id="results"></div><div class="section"><h2>La mia rosa</h2><span class="muted">× per correggere</span></div><div class="roster" id="roster"></div><div class="manual" id="manual"><b>Aggiungi nome manualmente</b><div class="mgrid"><input id="mn" placeholder="Nome"><select id="mr"><option>P</option><option>D</option><option>C</option><option>A</option></select></div><div class="mgrid"><input id="mt" placeholder="Squadra"><input id="mq" type="number" value="1" min="1" placeholder="Qt."></div><button class="action mine" style="width:100%;margin-top:7px" id="madd">Aggiungi</button></div></div><div class="footer"><button class="primary" id="mopen">+ nome</button><button id="backup">Backup</button><button id="reset">Reset</button></div><div class="modal" id="modal"><div class="sheet"><div class="headrow"><div><h3 id="pn"></h3><div class="meta" id="pm"></div></div><div style="text-align:right"><div class="lab">Tetto attuale</div><div class="bigcap" id="pc"></div></div></div><div class="signal" id="sig"></div><div class="why"><b id="why1"></b><br><span id="why2"></span></div><div class="buy"><input id="price" type="number" min="1" inputmode="numeric" placeholder="Prezzo"><button class="action mine" id="buy">✓ Preso da me</button></div><button class="action other" id="other">Uscito / preso da un altro</button><div class="section"><h2>3 alternative</h2></div><div class="alts" id="alts"></div><button class="action close" id="close">Chiudi</button></div></div><script>
const START=500,SLOTS={P:3,D:8,C:8,A:6},BASE={P:38,D:82,C:103,A:277};
const PEN={Atalanta:['Scamacca','Raspadori','Samardzic'],Bologna:['Orsolini','Bernardeschi','Dovbyk'],Cagliari:['Fazzini','Mina','Deiola'],Como:['Da Cunha','Kean','Paz N.'],Fiorentina:['Mastantuono','Pellegrino M.','Beto'],Frosinone:['Calò','Schmid','Kvernadze'],Genoa:['Colombo','Ostigard','Baldanzi'],Inter:['Calhanoglu','Zielinski','Dimarco'],Juventus:['Kolo Muani','Woltemade','Yildiz'],Lazio:['Zaccagni','Taylor K.','Pinamonti'],Lecce:['Geubbels','Stulic','Berisha M.'],Milan:['Pulisic','Modric','Ramos G.'],Monza:['Pessina','Cutrone','Colpani'],Napoli:['De Bruyne','Hojlund','McTominay'],Parma:['Valeri','Bernabè','Tourè E.'],Roma:['Malen','Dybala','Soulè'],Sassuolo:['Berardi','Laurientè','Esposito Se.'],Torino:['Vlasic','Simeone','Zapata D.'],Udinese:['Davis K.','Solet','Ekkelenkamp'],Venezia:['Busio','Adams A.','Yeboah J.']};
const ALIAS={'Martinez L.':'Lautaro Lautaro Martinez','Paz N.':'Nico Paz','Esposito F.P.':'Francesco Pio Esposito Pio Esposito','Milinkovic-Savic V.':'Vanja Milinkovic Savic','Pellegrini Lo.':'Lorenzo Pellegrini','Pellegrini Lu.':'Luca Pellegrini'};
let PLAYERS=[],filter='ALL',selected=null;let state=JSON.parse(localStorage.getItem('fantaWebState')||'null')||{credits:500,owned:{},sold:{},custom:[]};const $=x=>document.getElementById(x);function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}function key(p){return p.name+'|'+p.role}function status(p){return state.owned[key(p)]?'owned':state.sold[key(p)]?'sold':'available'}function all(){return[...PLAYERS,...state.custom]}function ownedRole(r){return Object.values(state.owned).filter(x=>x.role===r)}function left(r){return Math.max(0,SLOTS[r]-ownedRole(r).length)}function leftAll(){return Object.keys(SLOTS).reduce((a,r)=>a+left(r),0)}function spent(r){return ownedRole(r).reduce((a,x)=>a+x.price,0)}
function baseCap(p){let e=Number(p.expected||Math.max(1,p.q*1.8)),v;if(p.role==='P')v=e*1.08;else if(p.role==='D')v=e*.60;else if(p.role==='C')v=e*.95;else v=e*2.05;if(p.role==='P')v=Math.min(v,42);if(p.role==='D')v=Math.min(v,38);if(p.role==='C')v=Math.min(v,52);if(p.role==='A')v=Math.min(v,155);return Math.max(1,Math.round(v))}function delta(){let d=0;Object.values(state.owned).forEach(x=>d+=baseCap(x)-x.price);return Math.round(d)}function weights(){let w={P:.05,D:.17,C:.25,A:.53},s=0;for(const r in w){if(left(r)>0)s+=w[r];else w[r]=0}for(const r in w)w[r]=s?w[r]/s:0;return w}function boost(r){let d=delta(),w=weights();return left(r)?Math.round((d*w[r])/Math.max(1,Math.min(left(r),3))):0}function maxOne(){return Math.max(1,state.credits-Math.max(0,leftAll()-1))}function cap(p){let c=baseCap(p)+boost(p.role);let ps=PEN[p.team]||[],pi=ps.indexOf(p.name);if(pi===0)c+=p.role==='A'?5:p.role==='C'?3:1;c=Math.min(c,maxOne());let rb=Math.max(1,BASE[p.role]-spent(p.role)+Math.max(0,boost(p.role))*Math.max(1,left(p.role)));if(left(p.role)>1)c=Math.min(c,Math.max(1,rb-(left(p.role)-1)));return Math.max(1,Math.round(c))}function save(){localStorage.setItem('fantaWebState',JSON.stringify(state));render()}
function parseHtml(t){let d=new DOMParser().parseFromString(t,'text/html'),out=[];d.querySelectorAll('tr').forEach(tr=>{let td=[...tr.querySelectorAll('td')].map(x=>x.textContent.trim());if(td.length>=5&&/^[PDCA]$/.test(td[0])&&/^\d+$/.test(td[3]))out.push({role:td[0],name:td[1],team:td[2],q:+td[3],expected:+td[4]||1})});return dedupe(out)}function parseMd(t){let out=[];for(const line of t.split('\n')){if(!/^\|?\s*[PDCA]\s*\|/.test(line)&&!/^[PDCA]\s*\|/.test(line))continue;let clean=line.replace(/\[([^\]]+)\]\([^\)]+\)/g,'$1').replace(/^\|/,'').replace(/\|$/,'');let a=clean.split('|').map(x=>x.trim());if(a.length>=5&&/^[PDCA]$/.test(a[0])&&/^\d+$/.test(a[3]))out.push({role:a[0],name:a[1],team:a[2],q:+a[3],expected:+a[4]||1})}return dedupe(out)}function dedupe(a){let m=new Map;for(const p of a)m.set(key(p),p);return[...m.values()]}
async function load(){let cached=JSON.parse(localStorage.getItem('fantaList572')||'null');if(cached&&cached.length>500){PLAYERS=cached;$('loadStatus').innerHTML='<b class="green">✓ '+PLAYERS.length+' giocatori caricati dalla cache.</b> Aggiorno il listone in sottofondo…';enable();render()}let got=[];try{let r=await fetch('https://astafantacalcio.com/giocatori',{cache:'no-store'});if(r.ok)got=parseHtml(await r.text())}catch(e){}if(got.length<500){try{let r=await fetch('https://r.jina.ai/https://astafantacalcio.com/giocatori',{cache:'no-store'});if(r.ok)got=parseMd(await r.text())}catch(e){}}if(got.length>500){PLAYERS=got;localStorage.setItem('fantaList572',JSON.stringify(got));$('loadStatus').innerHTML='<b class="green">✓ Listone aggiornato: '+got.length+' giocatori caricati.</b>';enable();render()}else if(!PLAYERS.length){$('loadStatus').innerHTML='<b class="red">Non riesco a scaricare il listone.</b> Controlla la connessione e ricarica. Nel frattempo puoi usare “+ nome” per inserirlo al volo.';enable();render()}}
function enable(){$('search').disabled=false;$('search').focus()}function roleCards(){$('roles').innerHTML=['P','D','C','A'].map(r=>`<div class="role"><b>${r} ${SLOTS[r]-left(r)}/${SLOTS[r]}</b><small>${spent(r)} spesi • target ${BASE[r]}</small><small>delta/slot ${boost(r)>=0?'+':''}${boost(r)}</small></div>`).join('')}function strategy(){let d=delta(),w=weights(),alloc=Object.keys(w).filter(r=>left(r)>0).map(r=>`${r} ${d>=0?'+':''}${Math.round(d*w[r])}`).join(' • ');$('strategy').innerHTML=d>0?`<b class="green">Hai ${d} crediti di margine.</b><br>Riallocazione consigliata: ${alloc}`:d<0?`<b class="red">Sei ${Math.abs(d)} crediti sopra strategia.</b><br>Recupero consigliato: ${alloc}`:`<b class="yellow">Strategia in equilibrio.</b><br>Target P 38 • D 82 • C 103 • A 277`}
function visible(){let q=norm($('search').value),terms=q.split(/\s+/).filter(Boolean),a=all().filter(p=>{let h=norm([p.name,ALIAS[p.name]||'',p.team].join(' '));return !terms.length||terms.every(t=>h.includes(t))});if('PDCA'.includes(filter)&&filter.length===1)a=a.filter(p=>p.role===filter);if(filter==='AVAILABLE')a=a.filter(p=>status(p)==='available');if(filter==='OWNED')a=a.filter(p=>status(p)==='owned');a.sort((a,b)=>{let sa=status(a),sb=status(b);if(sa!==sb)return sa==='available'?-1:sb==='available'?1:0;return(b.expected||0)-(a.expected||0)});return a.slice(0,q?70:80)}function renderResults(){let a=visible();$('count').textContent=`${a.length} mostrati • ${all().length} nel listone`;$('results').innerHTML=a.map(p=>{let s=status(p),ps=PEN[p.team]||[],pi=ps.indexOf(p.name),pen=pi>=0?` • 🎯R${pi+1}`:'';return`<div class="player ${s}" data-k="${encodeURIComponent(key(p))}"><div class="badge">${p.role}</div><div><div class="pname">${p.name}</div><div class="meta">${p.team} • Qt ${p.q} • atteso ${p.expected||'-'}${pen}</div></div><div class="cap"><b>${s==='owned'?state.owned[key(p)].price:cap(p)}</b><small>${s==='owned'?'PAGATO':s==='sold'?'USCITO':'MAX ORA'}</small></div></div>`}).join('')||'<div class="status">Nessun risultato. Prova solo il cognome oppure usa “+ nome”.</div>';document.querySelectorAll('.player').forEach(e=>e.onclick=()=>{selected=all().find(p=>key(p)===decodeURIComponent(e.dataset.k));if(selected)openPlayer(selected)})}function renderRoster(){let a=Object.values(state.owned).sort((a,b)=>'PDCA'.indexOf(a.role)-'PDCA'.indexOf(b.role));$('roster').innerHTML=a.length?a.map(x=>`<div class="rr"><div><b>${x.role} • ${x.name}</b><div class="meta">${x.team} • cap base ${baseCap(x)}</div></div><div><b>${x.price}</b> <button data-del="${encodeURIComponent(key(x))}">×</button></div></div>`).join(''):'<span class="muted">Ancora nessun acquisto.</span>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let k=decodeURIComponent(b.dataset.del);if(confirm('Rimuovere acquisto?')){state.credits+=state.owned[k].price;delete state.owned[k];save()}})}function render(){$('credits').textContent=state.credits;$('slots').textContent=leftAll();$('reserve').textContent=leftAll();let d=delta();$('delta').textContent=d>0?`+${d} vs strategia`:d<0?`${d} vs strategia`:'Strategia in equilibrio';$('delta').className='delta '+(d>0?'green':d<0?'red':'yellow');roleCards();strategy();renderResults();renderRoster()}
function alternatives(p){return all().filter(x=>x.role===p.role&&status(x)==='available'&&key(x)!==key(p)).map(x=>({...x,d:Math.abs((x.expected||0)-(p.expected||0))})).sort((a,b)=>a.d-b.d||(b.expected||0)-(a.expected||0)).slice(0,3)}function openPlayer(p){let c=cap(p),s=status(p);$('pn').textContent=p.name;let ps=PEN[p.team]||[],pi=ps.indexOf(p.name);$('pm').textContent=`${p.role} • ${p.team} • Qt ${p.q} • atteso ${p.expected||'-'}${pi>=0?' • rigorista #'+(pi+1):''}`;$('pc').textContent=c;let txt='VERDE • vai',cl='sg';if(s!=='available'){txt=s==='owned'?'GIÀ TUO':'GIÀ USCITO';cl='sr'}else if(boost(p.role)<0){txt='GIALLO • disciplina';cl='sy'}$('sig').textContent=txt;$('sig').className='signal '+cl;$('why1').textContent=`Tetto base ${baseCap(p)} • correzione reparto ${boost(p.role)>=0?'+':''}${boost(p.role)}`;$('why2').textContent=`Delta complessivo ${delta()>=0?'+':''}${delta()}. Devi conservare almeno ${Math.max(0,leftAll()-1)} crediti per gli altri slot.`;$('price').value='';$('alts').innerHTML=alternatives(p).map(a=>`<div class="alt"><b>${a.name}</b>${a.team}<br>max <strong>${cap(a)}</strong></div>`).join('');$('modal').classList.add('show')}
$('buy').onclick=()=>{if(!selected)return;let v=parseInt($('price').value);if(!v||v<1)return alert('Inserisci il prezzo');if(left(selected.role)<=0)return alert('Ruolo già completo');if(v>maxOne())return alert('Così non rimane 1 credito per ogni slot vuoto');state.owned[key(selected)]={...selected,price:v};delete state.sold[key(selected)];state.credits-=v;save();$('modal').classList.remove('show')};$('other').onclick=()=>{if(!selected)return;state.sold[key(selected)]=true;save();$('modal').classList.remove('show')};$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('search').oninput=renderResults;$('clear').onclick=()=>{$('search').value='';renderResults();$('search').focus()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;renderResults()});$('mopen').onclick=()=>{$('manual').classList.toggle('show')};$('madd').onclick=()=>{let n=$('mn').value.trim(),r=$('mr').value,t=$('mt').value.trim()||'—',q=Math.max(1,+$('mq').value||1);if(!n)return;state.custom.push({name:n,role:r,team:t,q,expected:Math.max(1,Math.round(q*1.8))});$('mn').value='';$('search').value=n;save();$('manual').classList.remove('show')};$('reset').onclick=()=>{if(confirm('Azzerare tutta l’asta?')){state={credits:500,owned:{},sold:{},custom:[]};save()}};$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fanta_backup.json';a.click()};render();load();
</script></body></html>
